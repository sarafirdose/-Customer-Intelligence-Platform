# ==============================================================================
# Customer Intelligence Platform - Docker Compose Service Orchestration
# ==============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: cip_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cip_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cip_secure_password}
      POSTGRES_DB: ${DB_NAME:-customer_intelligence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cip_user} -d $${POSTGRES_DB:-customer_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cip_backend
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - ENV=production
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts
      - ./data:/app/data

volumes:
  pgdata:
    driver: local
