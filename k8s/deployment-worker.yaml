apiVersion: apps/v1
kind: Deployment
metadata:
  name: cip-worker
  labels:
    app: cip-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cip-worker
  template:
    metadata:
      labels:
        app: cip-worker
    spec:
      containers:
      - name: worker
        image: cip-worker:1.0.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: cip-config
        - secretRef:
            name: cip-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: storage-volume
          mountPath: /app/artifacts
          subPath: artifacts
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: cip-pvc
