apiVersion: v1
kind: ConfigMap
metadata:
  name: cip-config
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  METRICS_ENABLED: "true"
  SCHEDULER_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "240"
  MAX_REQUEST_SIZE_MB: "25"
  DB_HOST: "cip-postgres-service"
  DB_PORT: "5432"
  DB_NAME: "cip_db"
  REDIS_HOST: "cip-redis-service"
  REDIS_PORT: "6379"
