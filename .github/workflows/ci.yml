# ==============================================================================
# Customer Intelligence Platform - CI/CD Pipeline
# Phase 6A Enhanced: Full 5-job pipeline
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: "3.10"
  WORKING_DIR: "Customer-Intelligence-Platform"

jobs:
  # ============================================================
  # Job 1: Code Quality (Lint + Format)
  # ============================================================
  lint:
    name: "Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      - name: Black (Format Check)
        run: black --check ${{ env.WORKING_DIR }}/backend
        continue-on-error: false

      - name: isort (Import Order Check)
        run: isort --check-only ${{ env.WORKING_DIR }}/backend

      - name: Flake8 (Style Check)
        run: |
          flake8 ${{ env.WORKING_DIR }}/backend \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --exclude=alembic/,__pycache__

      - name: MyPy (Type Check)
        run: |
          mypy ${{ env.WORKING_DIR }}/backend \
            --ignore-missing-imports \
            --exclude alembic

  # ============================================================
  # Job 2: Tests + Coverage
  # ============================================================
  test:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cip_test
          POSTGRES_USER: cip_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.WORKING_DIR }}/requirements.txt
          pip install -e ${{ env.WORKING_DIR }}/

      - name: Set up Test Environment
        run: |
          cp ${{ env.WORKING_DIR }}/.env.example ${{ env.WORKING_DIR }}/.env
          echo "DB_HOST=localhost" >> ${{ env.WORKING_DIR }}/.env
          echo "DB_NAME=cip_test" >> ${{ env.WORKING_DIR }}/.env
          echo "DB_USER=cip_user" >> ${{ env.WORKING_DIR }}/.env
          echo "DB_PASSWORD=test_password" >> ${{ env.WORKING_DIR }}/.env
          echo "ENV=testing" >> ${{ env.WORKING_DIR }}/.env
          echo "SCHEDULER_ENABLED=false" >> ${{ env.WORKING_DIR }}/.env

      - name: Run Full Test Suite
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage.xml
          retention-days: 7

  # ============================================================
  # Job 3: Security Scan
  # ============================================================
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        run: |
          bandit -r ${{ env.WORKING_DIR }}/backend \
            --exclude ${{ env.WORKING_DIR }}/backend/ml/training.py \
            -ll \
            -f txt
        continue-on-error: true  # Report but don't fail CI on warnings

  # ============================================================
  # Job 4: Docker Build Validation
  # ============================================================
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          push: false
          tags: cip-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 5: Summary Report
  # ============================================================
  summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [ lint, test, security, docker-build ]
    if: always()

    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality (lint) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests & Coverage | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
