# ==============================================================================
# Customer Intelligence Platform - Continuous Integration (CI) Workflow
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Customer-Intelligence-Platform/requirements.txt
          pip install -e Customer-Intelligence-Platform/

      - name: Run Linters & Formatters Check
        run: |
          pip install black isort flake8 mypy
          black --check Customer-Intelligence-Platform/backend
          isort --check-only Customer-Intelligence-Platform/backend
          flake8 Customer-Intelligence-Platform/backend --max-line-length=88 --extend-ignore=E203
          mypy Customer-Intelligence-Platform/backend --ignore-missing-imports

      - name: Run Test Suite
        run: |
          pytest Customer-Intelligence-Platform/tests/
